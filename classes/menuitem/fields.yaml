# ===================================
#  Field Definitions
# ===================================

fields:

    search:
        type: RainLab\Pages\FormWidgets\MenuItemSearch

    title:
        span: left
        label: Title

    type:
        span: right
        label: Type
        type: dropdown

    url:
        label: URL

    reference:
        label: Reference
        type: dropdown
        cssClass: input-sidebar-control

    cmsPage:
        label: CMS Page
        comment: Select a page to open when the menu item is clicked.
        type: dropdown
        cssClass: input-sidebar-control

    nesting:
        label: Allow nested items
        comment: Nested items could be generated dynamically by static page and some other item types
        type: checkbox
        default: true

    replace:
        label: Replace this item with its generated children
        comment: Use this checkbox to push generated menu items to the same level with this item. This item itself will be hidden.
        type: checkbox
        default: true

tabs:
    fields:
        viewBag[isHidden]:
            label: Hidden
            comment: Hide this menu item from appearing on the front-end.
            type: checkbox
            tab: Display

        code:
            label: Code
            comment: Enter the menu item code if you want to access it with the API.
            tab: Attributes
            span: auto

        viewBag[cssClass]:
            label: CSS Class
            comment: Enter a CSS class name to give this menu item a custom appearance.
            tab: Attributes
            span: auto

        viewBag[isExternal]:
            label: External link
            comment: Open links for this menu item in a new window.
            type: checkbox
            tab: Attributes
